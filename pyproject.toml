[project]
name = "popelka"
version = "0.1.0"
description = "Reverse-engineering toolkit for the Concept VR3125 (Tuya/LDROBOT) robot vacuum"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lz4>=4.3.0",
]

[project.optional-dependencies]
# tinytuya pulls in `cryptography`, which has no Android wheel; on Termux
# install it with `pkg install python-cryptography` instead of via uv.
local = ["tinytuya>=1.17.0"]

[project.scripts]
popelka = "popelka.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popelka"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
